# Render Blueprint – creates both services (Dashboard → New → Blueprint → pick this repo).
# Values marked "sync: false" are asked for once when the Blueprint is created.
services:
  - type: web
    name: secretsanta-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./SecretSanta.ApiService/Dockerfile
    dockerContext: .
    envVars:
      # Npgsql format from Neon, e.g. Host=...neon.tech;Database=...;Username=...;Password=...;SSL Mode=Require
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Shared secret between web and API (generated by Render)
      - key: ApiSecurity__InternalApiKey
        generateValue: true

  - type: web
    name: secretsanta-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./SecretSanta.Web/Dockerfile
    dockerContext: .
    envVars:
      # Public URL of the API service, e.g. https://secretsanta-api.onrender.com
      - key: ApiService__BaseUrl
        sync: false
      - key: ApiSecurity__InternalApiKey
        fromService:
          type: web
          name: secretsanta-api
          envVarKey: ApiSecurity__InternalApiKey
      - key: Google__ClientId
        sync: false
      - key: Google__ClientSecret
        sync: false
